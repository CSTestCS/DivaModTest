name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test VRoidDiva.sln -c Release
      - run: >
          dotnet publish src/VRoidDiva/VRoidDiva.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: VRoidDiva-win-x64
          path: publish/win-x64/VRoidDiva.exe
